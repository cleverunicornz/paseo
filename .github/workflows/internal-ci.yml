name: Internal daemon qualification

on:
  pull_request:
    # Candidate lanes (infra-v2 D-000385) are qualified like the trunk.
    branches: [internal/main, "candidate/**"]
  push:
    branches: [internal/main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a release from internal/main (empty for checks only)
        type: string
        required: false

permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  # Playwright 1.58.2 with its browsers (matches the lockfile's playwright-core), pinned by digest
  # as in the dashboard's UI tests.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d

jobs:
  daemon:
    runs-on: { group: ci, labels: build-native }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the pinned Codex CLI and ripgrep for the local-tools tests
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund --no-save @openai/codex@0.159.2
          codex="$RUNNER_TEMP/codex/node_modules/.bin/codex"
          test "$("$codex" --version)" = "codex-cli 0.159.2"
          echo "PASEO_TEST_CODEX_BIN=$codex" >> "$GITHUB_ENV"
          command -v rg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ripgrep; }
      - name: Build daemon and CLI
        run: npm run build:server
      - name: Check source
        run: |
          npm run lint
          npm run typecheck:server
          npm run format:check:files -- packages/server/src/server/agent/runtime-mcp-config.ts packages/server/src/server/agent/runtime-mcp-config.test.ts packages/server/src/server/agent/agent-manager.ts packages/server/src/server/agent/agent-manager.test.ts packages/server/src/server/session/daemon/npm-global-cli.ts packages/server/src/server/session/daemon/npm-global-cli.test.ts packages/server/src/server/websocket-server.ts packages/server/src/server/daemon-client.e2e.test.ts public-docs/plugins/reference.md .github/workflows/internal-ci.yml packages/server/src/server/agent/agent-tokens.ts packages/server/src/server/agent/agent-tokens.test.ts packages/server/src/server/mcp-gateway/backends.ts packages/server/src/server/mcp-gateway/mcp-gateway.ts packages/server/src/server/mcp-gateway/mcp-gateway.test.ts packages/server/src/server/auth.ts packages/server/src/server/auth.test.ts packages/server/src/server/config.ts packages/server/src/server/config.test.ts packages/server/src/server/plugins/lifecycle/index.ts packages/server/src/server/plugins/lifecycle/handlers.test.ts packages/server/src/server/agent/agent-mcp.e2e.test.ts packages/plugin/src/server/lifecycle.ts public-docs/mcp.md SECURITY.md packages/server/src/server/agent/agent-storage.ts packages/server/src/server/agent/providers/claude/query.ts packages/server/src/server/agent/providers/claude/mcp-config-file.ts packages/server/src/server/agent/providers/claude/mcp-config-file.posix.test.ts packages/server/src/server/agent/providers/claude/agent.mcp-config.posix.test.ts packages/server/src/server/agent/providers/provider-argv-credentials.posix.test.ts packages/website/public/schemas/paseo.config.v1.json packages/server/src/server/agent/agent-manager-timeline-hook.test.ts packages/server/src/server/agent/providers/model-gateway-launch.posix.test.ts packages/server/src/server/plugins/timeline-item-hook.e2e.test.ts packages/server/src/server/agent/agent-sdk-types.ts packages/server/src/server/agent/model-gateway-env.ts packages/server/src/server/agent/providers/model-gateway-proxy.posix.test.ts packages/server/src/server/test-utils/model-gateway-env-inputs.ts packages/server/src/server/agent/providers/claude/query.ts packages/server/src/server/agent/provider-registry.ts packages/server/src/server/agent/providers/claude/agent.ts packages/server/src/server/agent/providers/claude/agent.spawn.test.ts packages/server/src/server/agent/providers/codex-app-server-agent.ts packages/server/src/server/bootstrap.ts packages/server/src/server/config-environment.ts packages/server/src/server/persisted-config.ts packages/plugin/src/server/index.ts docs/architecture.md docs/plugins.md plugin-examples/lifecycle-logger/README.md packages/server/src/server/agent/harness-process.ts packages/server/src/server/agent/harness-spawn-sites.test.ts packages/server/src/server/agent/providers/harness-process-env.posix.test.ts packages/server/src/server/agent/provider-snapshot-manager.ts packages/server/src/server/agent/provider-launch-config.ts packages/server/src/server/agent/providers/diagnostic-utils.ts packages/server/src/executable-resolution/executable-resolution.ts packages/server/src/utils/spawn.ts packages/protocol/src/provider-config.ts packages/server/src/server/local-tools/codex-executor.ts packages/server/src/server/local-tools/codex-executor.test.ts packages/server/src/server/local-tools/config.ts packages/server/src/server/local-tools/local-processes.ts packages/server/src/server/local-tools/local-tools.ts packages/server/src/server/local-tools/patch-format.ts packages/server/src/server/local-tools/patch-format.test.ts packages/server/src/server/local-tools/local-tools.e2e.test.ts packages/server/src/server/local-tools/runtime.ts packages/server/src/server/local-tools/tool-tree.ts packages/server/src/server/local-tools/tool-tree.test.ts packages/server/src/server/local-tools/tool-tree-service.ts packages/server/src/server/local-tools/tool-tree.e2e.test.ts packages/server/src/server/agent/providers/builtin-tools-launch.posix.test.ts packages/server/src/server/test-utils/codex-binary.ts packages/server/src/server/file-explorer/service.ts packages/server/src/server/file-explorer/service.posix.test.ts packages/server/src/server/agent/tools/paseo-tools.ts packages/app/app.config.js packages/app/src/agent-stream/view.tsx packages/app/src/components/left-sidebar.tsx packages/app/src/command-center/workspace-contributions.test.ts packages/app/src/command-center/workspace-contributions.ts packages/app/src/command-center/workspace-registration.tsx packages/app/src/hooks/use-fork-agent.ts packages/app/src/runtime/host-features.test.ts packages/app/src/runtime/host-features.ts packages/app/src/runtime/host-runtime.ts packages/app/src/screens/workspace/workspace-header-menu.tsx packages/app/src/stores/download-store.ts packages/app/src/types/host-connection.ts packages/app/src/utils/test-daemon-connection.ts packages/app/src/workspace-tabs/launcher/index.tsx packages/plugin/src/server/contracts.ts packages/plugin/src/server/mcp.ts packages/plugin/src/server/stop-readiness.ts packages/protocol/src/daemon-endpoints.ts packages/protocol/src/host-connection-schema.ts packages/server/scripts/supervisor-entrypoint.ts packages/server/scripts/supervisor.ts packages/server/src/server/agent/agent-admission.ts packages/server/src/server/config-environment.ts packages/server/src/server/daemon-worker.ts packages/server/src/server/mcp-gateway/plugin-tool-call.ts packages/server/src/server/mcp-gateway/plugin-tool-call.e2e.test.ts packages/server/src/server/mcp-gateway/shutdown-callers.ts packages/server/src/server/mcp-gateway/shutdown-callers.test.ts packages/server/src/server/plugins/plugin-process-protocol.ts packages/server/src/server/plugins/plugin-process.ts packages/server/src/server/plugins/runtime.ts packages/server/src/server/plugins/timeline-deliveries.ts packages/server/src/server/plugins/timeline-drain.e2e.test.ts packages/server/src/server/session-runtime-config.ts packages/server/src/server/single-agent.e2e.test.ts packages/server/src/server/stop-readiness.ts packages/server/src/server/stop-readiness.e2e.test.ts packages/server/src/server/test-utils/paseo-daemon.ts packages/server/src/server/test-utils/prefix-proxy.ts packages/server/src/server/web-base-path.ts packages/server/src/server/web-base-path.test.ts packages/server/src/server/web-base-path.e2e.test.ts packages/server/src/server/web-base-path.browser.e2e.test.ts packages/server/src/server/web-ui.ts packages/server/src/server/web-ui.test.ts scripts/build-daemon-web-ui.mjs public-docs/configuration.md public-docs/docker.md public-docs/plugins/reference.md public-docs/session-containers.md public-docs/web-ui.md packages/plugin/src/server/lifecycle.ts packages/server/src/server/config-environment.ts packages/server/src/server/config.test.ts
      - name: Check launch and update behavior
        working-directory: packages/server
        run: |
          npx vitest run src/server/agent/runtime-mcp-config.test.ts src/server/session/daemon/npm-global-cli.test.ts src/server/session/daemon/daemon-self-updater.test.ts
          npx vitest run src/server/agent/agent-manager.test.ts src/server/agent/agent-manager-timeline-hook.test.ts src/server/agent/provider-snapshot-manager.test.ts
          npx vitest run src/server/agent/agent-tokens.test.ts src/server/mcp-gateway/mcp-gateway.test.ts src/server/mcp-gateway/shutdown-callers.test.ts src/server/auth.test.ts src/server/config.test.ts src/server/plugins/lifecycle/handlers.test.ts
          npx vitest run src/server/agent/providers/claude/agent.mcp-config.posix.test.ts src/server/agent/providers/claude/mcp-config-file.posix.test.ts src/server/agent/providers/provider-argv-credentials.posix.test.ts src/server/agent/providers/claude/agent.spawn.test.ts src/server/agent/providers/model-gateway-launch.posix.test.ts src/server/agent/providers/model-gateway-proxy.posix.test.ts src/server/agent/providers/harness-process-env.posix.test.ts src/server/agent/harness-spawn-sites.test.ts
          npx vitest run src/server/agent/agent-mcp.e2e.test.ts --maxWorkers=1
          test -n "$PASEO_TEST_CODEX_BIN"
          npx vitest run src/server/local-tools/ src/server/agent/providers/builtin-tools-launch.posix.test.ts src/server/agent/provider-registry.test.ts src/server/file-explorer/service.posix.test.ts --maxWorkers=1
          npx vitest run src/server/plugins/timeline-item-hook.e2e.test.ts --maxWorkers=1
          npx vitest run src/server/daemon-client.e2e.test.ts -t 'receives server_info on websocket connect'
          npx vitest run src/server/plugins/timeline-drain.e2e.test.ts src/server/stop-readiness.e2e.test.ts src/server/single-agent.e2e.test.ts src/server/mcp-gateway/plugin-tool-call.e2e.test.ts src/server/web-base-path.e2e.test.ts --maxWorkers=1
          npx vitest run src/server/web-base-path.test.ts src/server/web-ui.test.ts src/server/plugins/plugin-process.test.ts src/server/plugins/runtime.posix.test.ts
      - name: Check session runtime in the app and protocol
        run: |
          npm run test --workspace=@getpaseo/protocol -- src/daemon-endpoints.test.ts
          cd packages/app && npx vitest run src/runtime/host-features.test.ts src/runtime/host-runtime.test.ts src/types/host-connection.test.ts src/command-center/workspace-contributions.test.ts
      - name: Build bundled web UI
        run: npm run build:daemon-web-ui
      - name: Keep the built packages for the browser check
        run: tar -czf "$RUNNER_TEMP/paseo-dist.tgz" packages/*/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paseo-dist-${{ github.run_id }}
          path: ${{ runner.temp }}/paseo-dist.tgz
          retention-days: 1
          if-no-files-found: error
      - name: Pack release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paseo-release"
          for package in highlight relay protocol client plugin server cli; do
            npm pack --ignore-scripts --workspace="@getpaseo/$package" --pack-destination "$RUNNER_TEMP/paseo-release"
          done
          cd "$RUNNER_TEMP/paseo-release"
          sha256sum *.tgz > SHA256SUMS
          sha512sum *.tgz > SHA512SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          node --version > NODE_VERSION
      - name: Publish source-qualified release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/internal/main
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/paseo-release/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes 'Source-built daemon packages. Package names and protocol remain compatible with the upstream release. Install all seven packages together; SHA256SUMS and SHA512SUMS bind the assets. SOURCE_COMMIT and NODE_VERSION retain build identity.'

  web-ui-base-path:
    # The browser comes from the pinned Playwright image, which needs a Docker daemon. The web UI
    # export does not fit this runner's memory, so the daemon job's build is reused.
    needs: daemon
    runs-on: { group: ci, labels: build-docker }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: paseo-dist-${{ github.run_id }}
          path: ${{ runner.temp }}
      - name: Unpack the daemon job's built packages and web UI
        run: tar -xzf "$RUNNER_TEMP/paseo-dist.tgz"
      - name: Load the web UI under /s/x/ behind a prefix proxy in Chromium
        shell: bash
        run: |
          set -euo pipefail
          # The image's Chromium, driven by the lockfile's playwright-core over loopback. The Docker
          # daemon does not see this job's files, so the package is copied in, as the dashboard does.
          docker create --name playwright-browser --network host --init "$PLAYWRIGHT_IMAGE" \
            node /tmp/playwright-core/cli.js run-server --port 39123 --host 127.0.0.1
          trap 'docker logs playwright-browser || true; docker rm -f playwright-browser >/dev/null || true' EXIT
          docker cp node_modules/playwright-core playwright-browser:/tmp/playwright-core
          docker start playwright-browser
          for attempt in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/39123) 2>/dev/null; then break; fi
            if [ "$attempt" = 60 ]; then echo "The browser server did not start" >&2; exit 1; fi
            sleep 1
          done
          cd packages/server
          PLAYWRIGHT_WS_ENDPOINT=ws://127.0.0.1:39123/ npx vitest run src/server/web-base-path.browser.e2e.test.ts --maxWorkers=1
