name: Console daemon qualification

# The console line (infra-v2 P-000269 H2): the console runs upstream v0.11.2 with the fork's
# leak fix, released from this line alone. A branch of this workflow qualifies the line on
# every pull request and push, and publishes a source-qualified release when dispatched with
# a tag. The release rules live in scripts/console-release-channel.mjs.

on:
  pull_request:
    # The console's candidate lane and its trunk, per the release rules below.
    branches: [console/main, candidate/console-heap-0.11.2]
  push:
    branches: [console/main, candidate/console-heap-0.11.2]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Publish a release from the console line (empty for checks only)
        type: string
        required: false

# Qualification is read-only. The write token a release needs is granted to the publish
# job alone, which runs only on a workflow_dispatch that passed the release guard.
permissions:
  contents: read

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  daemon:
    # The build is compile-bound (TypeScript over the seven packages, then the app's web
    # export into the server's dist), so it runs natively on build-native with its package
    # caches (I-000094, ci-runners "Package caches on build-native, automatic"). No Docker
    # stage exists for this line, so no Dockerfile is involved and no compiler runs in one.
    runs-on: { group: ci, labels: build-native }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The console release ancestry check below names upstream 0.11.2 and
          # the heap fix by commit; a shallow clone does not carry them as
          # objects. Full history is what those two `merge-base --is-ancestor`
          # calls need, and what proves the release is really on this line.
          fetch-depth: 0
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - name: Check the release rules
        run: node --test scripts/console-release-channel.test.mjs scripts/console-ci-workflow.test.mjs scripts/check-managed-update-anchors.test.mjs scripts/console-release-provenance.test.mjs scripts/release-assets.test.mjs
      - name: Check the console release ancestry
        # The console's line, and the heap fix in it. The scheduler port's own
        # commits are also listed in the checklist; the built payload's behavior
        # is proven in the step after the build.
        # The 2026-10-16 v0.11.2-cvu.2 defect was a right-looking tag over a
        # 0.10.3 v2-line build, so both checks are needed.
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 759532509 HEAD
          git merge-base --is-ancestor d282eb2ed HEAD
      - name: Check the release tag
        # The pre-build guard, ahead of npm ci and every build step: the repository, the ref,
        # the tag's shape and its base version. A dispatch in a fork, or a tag the line does
        # not publish, refuses here, before anything is installed or built.
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/console-release-channel.mjs guard \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$RELEASE_TAG" \
            "$(node -p 'require("./packages/server/package.json").version')"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build daemon and CLI
        run: npm run build:server
      - name: Build the bundled web UI
        # The server tarball ships dist/server/web-ui; the image's install serves it.
        run: npm run build:daemon-web-ui
      - name: Check source
        run: |
          npm run lint
          npm run typecheck:server
          npm run format:check
      - name: Check the managed-update anchors
        # runner-images images/repo-pod/paseo-managed-update.mjs replaces each of two exact
        # strings in the built server and fails its image build if either is not present
        # exactly once. The CLI anchor is the WHOLE installLatest body, so a change inside
        # that body would move it and the image build would refuse; the websocket anchor is
        # one line, so other content in that file is irrelevant to the consumer. The checker
        # applies exactly that rule, no stricter: PR #24's loop-health instrumentation adds
        # code to websocket-server.js and the consumer's own patcher still applies.
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-managed-update-anchors.mjs packages/server/dist/server/server
      - name: Check the built payload carries both fixes
        # The tag and the ancestry are claims; the built payload is the evidence.
        # The 2026-10-16 v0.11.2-cvu.2 defect carried neither fix. This RUNS the
        # just-built server: `scripts/console-payload-probes/*.mjs` drive the
        # built scheduler, the built limiter, the built streamer and the built
        # loop monitor, and each asserts the fix's behavior. A marker search
        # could not refuse the r1 validator's mutants - the bound disabled and
        # either heap helper reverted, each with every marker string intact - so
        # this stage proves behavior, not strings. It runs on every
        # qualification of the line, a pull request included, where no release
        # tag exists yet.
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import { assertPayloadCarriesFixes } from "./scripts/console-release-provenance.mjs";
          const observations = assertPayloadCarriesFixes("packages/server/dist/server");
          for (const observation of observations) {
            console.log(JSON.stringify(observation));
          }
          console.log("The built server behaves as both fixes require.");
          JS
      - name: Set the release version
        # Every workspace package takes the tag's version before packing (P-000269 H2). The
        # repo's own sync script rewrites the packages' internal dependency ranges too, so the
        # seven tarballs resolve each other and never the registry's base version. The version
        # is read from the tag, not from the packages, which still carry the base version.
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/console-release-channel.mjs version "$GITHUB_REF" "$RELEASE_TAG")"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync("package.json", "utf8")); p.version = process.argv[1]; fs.writeFileSync("package.json", `${JSON.stringify(p, null, 2)}\n`);' "$version"
          node scripts/sync-workspace-versions.mjs
          # The rewrite landed: every package carries the tag's version now.
          node scripts/console-release-channel.mjs packed-version \
            "$RELEASE_TAG" "$(node -p 'require("./packages/server/package.json").version')"
      - name: Pack release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paseo-release"
          for package in highlight relay protocol client plugin server cli; do
            npm pack --ignore-scripts --workspace="@getpaseo/$package" --pack-destination "$RUNNER_TEMP/paseo-release"
          done
          cd "$RUNNER_TEMP/paseo-release"
          sha256sum *.tgz > SHA256SUMS
          sha512sum *.tgz > SHA512SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
          node --version > NODE_VERSION
      - name: Check the release identity and its packed payload
        # PREPUBLICATION identity, on the real packed assets: the run's head, the
        # tag's commit and SOURCE_COMMIT are one commit, and each tarball's OWN
        # embedded package.json carries the tag's version - not merely its name.
        # The r1 validator renamed real 0.11.2 tarballs to `-0.11.2-cvu.3.tgz`
        # and the old gate accepted them; this stage reads the contents.
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - "$RUNNER_TEMP/paseo-release" "$RELEASE_TAG" "$GITHUB_SHA" <<'JS'
          import assert from "node:assert/strict";
          import {
            assertPackedReleaseAssets,
            assertPrepublicationProvenance,
            RELEASE_PACKAGES,
          } from "./scripts/console-release-provenance.mjs";
          import { readReleaseAssets } from "./scripts/release-assets.mjs";

          const [releaseDir, tag, runCommit] = process.argv.slice(2);
          const assets = readReleaseAssets({ releaseDir, expectedPackageNames: RELEASE_PACKAGES });
          // The same exact seven identities, filenames and byte digests are
          // required before and after publication, including unique coverage.
          assertPackedReleaseAssets({ tag, assets });
          assert.equal(assets.sourceCommit, runCommit, "SOURCE_COMMIT is the run's head");
          assert.equal(assets.nodeVersion, process.version, "NODE_VERSION");

          // The prepublication rule, including the built payload's behavior.
          assertPrepublicationProvenance({
            tag,
            runCommit,
            releaseCommit: runCommit,
            accountedAncestors: ["upstream-0.11.2", "heap-fix"],
            builtServerDir: "packages/server/dist/server",
          });
          console.log(`The packed ${tag} is the run's commit and packs the tag's version.`);
          JS
      - name: Install the release packages as the session image does
        # As runner-images images/repo-pod/install-paseo-release.sh: the seven packages in one
        # global install, each at the packages' version, the CLI resolving the installed server.
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./packages/server/package.json").version')"
          image="$RUNNER_TEMP/paseo-image"
          (cd "$RUNNER_TEMP/paseo-release" && sha256sum --check SHA256SUMS)
          npm install --global --prefix "$image" --no-audit --no-fund "$RUNNER_TEMP/paseo-release/"*.tgz
          node --input-type=module - "$image/lib/node_modules" "$version" <<'JS'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          const [root, version] = process.argv.slice(2);
          for (const name of ["highlight", "relay", "protocol", "client", "plugin", "server", "cli"]) {
            const pkg = JSON.parse(fs.readFileSync(path.join(root, "@getpaseo", name, "package.json"), "utf8"));
            assert.equal(pkg.version, version, `@getpaseo/${name}`);
          }
          const fromCli = createRequire(path.join(root, "@getpaseo/cli/package.json"));
          assert.equal(
            fs.realpathSync(fromCli.resolve("@getpaseo/server")),
            fs.realpathSync(path.join(root, "@getpaseo/server/dist/server/server/exports.js")),
          );
          JS
          test "$("$image/bin/paseo" --version)" = "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: paseo-release-${{ github.run_id }}
          path: ${{ runner.temp }}/paseo-release
          retention-days: 7
          if-no-files-found: error

  publish:
    # The release itself, in its own job so the write token reaches nothing else. It runs only
    # on a workflow_dispatch with a release tag, which the guard above has already checked, and
    # it republishes the packages the daemon job packed and installed.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: daemon
    runs-on: { group: ci, labels: automation-test-s }
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: paseo-release-${{ github.run_id }}
          path: ${{ runner.temp }}/paseo-release
      - name: Publish source-qualified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          # The trunk publishes a release; the candidate lane, a prerelease. The ref, tag shape
          # and base version were checked by the guard before the build.
          channel="$(node scripts/console-release-channel.mjs channel "$GITHUB_REF" "$RELEASE_TAG")"
          prerelease=()
          if [ "$channel" = prerelease ]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/paseo-release/"* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" "${prerelease[@]}" --notes 'Source-built daemon packages. Package names and protocol remain compatible with the upstream release. Install all seven packages together; SHA256SUMS and SHA512SUMS bind the assets. SOURCE_COMMIT and NODE_VERSION retain build identity.'

  qualify-published:
    # POSTPUBLICATION qualification, on what was really published. A release is a
    # claim; only the downloaded assets are evidence. This job has no write token:
    # it reads the release it just published and proves it. It downloads the seven
    # tarballs, installs them as the session image installs them (so their own
    # dependency graph resolves), and runs the payload behavior probes against the
    # INSTALLED server's dist - not this run's build directory, which could have
    # been repacked or replaced.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: publish
    runs-on: { group: ci, labels: automation-test-s }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - name: Download the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/paseo-published"
          mkdir -p "$published"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$published"
      - name: Qualify the published release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          published="$RUNNER_TEMP/paseo-published"
          tag_commit="$(node scripts/resolve-published-tag.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$GITHUB_SHA")"
          # Install the seven downloaded tarballs as the session image does: one
          # global install, so their own dependencies resolve and the probes load
          # the published bytes, not the build tree.
          image="$RUNNER_TEMP/paseo-published-image"
          npm install --global --prefix "$image" --no-audit --no-fund "$published/"*.tgz
          node --input-type=module - "$published" "$image/lib/node_modules" "$RELEASE_TAG" "$tag_commit" "$GITHUB_SHA" <<'JS'
          import path from "node:path";
          import {
            assertPayloadCarriesFixes,
            assertReleaseProvenance,
            RELEASE_PACKAGES,
          } from "./scripts/console-release-provenance.mjs";
          import { readReleaseAssets } from "./scripts/release-assets.mjs";

          const [releaseDir, installedRoot, tag, tagCommit, runCommit] = process.argv.slice(2);
          const assets = readReleaseAssets({ releaseDir, expectedPackageNames: RELEASE_PACKAGES });

          // The behavior proof runs against the INSTALLED server's dist: the
          // published bytes with their published dependency graph.
          const installedServer = path.join(installedRoot, "@getpaseo/server/dist/server");
          const observations = assertPayloadCarriesFixes(installedServer);

          const result = assertReleaseProvenance({
            tag,
            tagCommit,
            runCommit,
            assets,
            payloadObservations: observations,
          });
          console.log(
            JSON.stringify({
              qualified: true,
              installedServer,
              probes: observations.map((observation) => observation.probe),
              ...result,
            }),
          );
          JS

  server-unit:
    # The server's unit suite. It starts on the smallest test set, automation-test-s, per the
    # ci-runners ladder; a job moves up only after a memory kill on the smaller set, proven by
    # the container's OOMKilled reason or a cgroup OOM event, never by estimate. One worker: the
    # suite's subprocess-heavy git and agent files set its peak, not the worker count, and it
    # fits — this job passes 6197 tests on automation-test-s with no memory kill. A kill here is
    # the signal to reconsider the width, not the set.
    runs-on: { group: ci, labels: automation-test-s }
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install verified Node 22
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --output /tmp/paseo-node.tar.xz https://nodejs.org/dist/v22.23.3/node-v22.23.3-linux-x64.tar.xz
          echo 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de  /tmp/paseo-node.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/paseo-node"
          tar -xJf /tmp/paseo-node.tar.xz --strip-components=1 -C "$RUNNER_TEMP/paseo-node"
          echo "$RUNNER_TEMP/paseo-node/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the CLIs the unit tests resolve
        # Two assertions resolve the real Claude Code binary: the provider registry only lists
        # `claude` when its binary is on PATH, and ClaudeAgentClient resolves its version. Without
        # it they see "Provider 'claude' is not available", as the fork's own job found.
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/clis" --no-audit --no-fund --no-save @anthropic-ai/claude-code@2.1.296
          bin="$RUNNER_TEMP/clis/node_modules/.bin"
          test "$("$bin/claude" --version)" = "2.1.296 (Claude Code)"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Build server dependencies
        run: npm run build:server-deps
      - name: Run the server unit suite
        run: npm run test:unit --workspace=@getpaseo/server -- --maxWorkers=1 --exclude "src/server/file-observer/**"
      - name: Run the file observer suites alone
        # Upstream's thousand-write stress test times out under the parallel run's load; alone,
        # with retries, it still has to pass.
        working-directory: packages/server
        run: npx vitest run src/server/file-observer --maxWorkers=1 --retry=2
